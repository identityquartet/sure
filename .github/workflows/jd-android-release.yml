name: JD Android release

# Builds the extended mobile client from the `jd` branch and publishes a signed
# APK as a GitHub release (tracked by Obtainium).
on:
  push:
    branches: [jd]
    paths:
      - 'mobile/**'
      - '.github/workflows/jd-android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jd-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.32.4'
          channel: stable
          cache: true

      - name: Version
        run: |
          echo "BUILD_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Dependencies and icons
        working-directory: mobile
        run: |
          flutter pub get
          cp ../public/android-chrome-512x512.png assets/icon/app_icon.png
          dart run flutter_launcher_icons

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/extras

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > mobile/android/key.properties

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/sure-jd-v$BUILD_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jd-v$BUILD_NAME" "sure-jd-v$BUILD_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sure JD v$BUILD_NAME" \
            --notes "Extended Sure Android client built from $(echo $GITHUB_SHA | cut -c1-7)."
